  <rect x="20" y="612" width="516" height="80" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <rect x="20" y="612" width="4" height="80" rx="2" fill="#639922"/>
  <rect x="86" y="616" width="80" height="14" rx="7" fill="#639922"/>
  <text x="126" y="626" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">só na v2</text>
  <text x="36" y="644" font-size="11" font-weight="600" fill="#27500A">Disposições transitórias (seção 5)</text>
  <text x="36" y="660" font-size="10" fill="#3B6D11">v2 define: chamados antes de 01/12/2023 usam v1; novos usam v2.</text>
  <text x="36" y="674" font-size="10" fill="#3B6D11">Cláusula vencida (jun/2026) — v1 ainda ativa. RAG não aplica.</text>

  <!-- Só na v2: Nota PROC-043 -->
  <rect x="564" y="612" width="516" height="80" rx="7" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <rect x="564" y="612" width="4" height="80" rx="2" fill="#639922"/>
  <rect x="630" y="616" width="80" height="14" rx="7" fill="#639922"/>
  <text x="670" y="626" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">só na v2</text>
  <text x="580" y="644" font-size="11" font-weight="600" fill="#27500A">Nota sobre revisão da PROC-043</text>
  <text x="580" y="660" font-size="10" fill="#3B6D11">v2 avisa que PROC-043 está em revisão pelo Compliance.</text>
  <text x="580" y="674" font-size="10" fill="#3B6D11">Se concluída, o aviso é desinformação no índice RAG.</text>

  <!-- Só na v1: Desconto sem % -->
  <rect x="20" y="700" width="516" height="80" rx="7" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <rect x="20" y="700" width="4" height="80" rx="2" fill="#EF9F27"/>
  <rect x="86" y="704" width="80" height="14" rx="7" fill="#EF9F27"/>
  <text x="126" y="714" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">só na v1</text>
  <text x="36" y="732" font-size="11" font-weight="600" fill="#633806">Desconto por volume sem percentual</text>
  <text x="36" y="748" font-size="10" fill="#854F0B">v1 apenas diz "negociar com o Comercial". Sem faixa nem %.</text>
  <text x="36" y="762" font-size="10" fill="#854F0B">Clientes antigos podem ter descontos em aditivos fora das faixas da v2.</text>

  <!-- Idêntico: aprovação 5t -->
  <rect x="564" y="700" width="516" height="80" rx="7" fill="#EAF3DE" stroke="#1D9E75" stroke-width="0.5"/>
  <rect x="564" y="700" width="4" height="80" rx="2" fill="#1D9E75"/>
  <rect x="630" y="704" width="88" height="14" rx="7" fill="#1D9E75"/>
  <text x="674" y="714" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">idêntico nas duas</text>
  <text x="580" y="732" font-size="11" font-weight="600" fill="#085041">Aprovação para cargas acima de 5.000 kg</text>
  <text x="580" y="748" font-size="10" fill="#0F6E56">Ambas as versões: requer aprovação prévia do gerente</text>
  <text x="580" y="762" font-size="10" fill="#0F6E56">de operações regional. Único campo sem divergência.</text>

  <!-- SEÇÃO 4: Recomendações -->
  <rect x="20" y="798" width="1060" height="22" rx="5" fill="#444441"/>
  <text x="550" y="809" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Recomendações de ação</text>

  <rect x="20" y="826" width="336" height="72" rx="7" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="188" y="844" text-anchor="middle" font-size="11" font-weight="600" fill="#7A1F1F">Imediato — antes da ingestão</text>
  <text x="36" y="862" font-size="10" fill="#A32D2D">Obter decisão formal do Comercial sobre qual</text>
  <text x="36" y="876" font-size="10" fill="#A32D2D">versão é vigente. Arquivar a v1 ou marcá-la como</text>
  <text x="36" y="890" font-size="10" fill="#A32D2D">obsoleta no SharePoint com link para a v2.</text>

  <rect x="372" y="826" width="336" height="72" rx="7" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="540" y="844" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Curto prazo — pipeline RAG</text>
  <text x="388" y="862" font-size="10" fill="#854F0B">Adicionar metadado status: obsoleto na v1 para</text>
  <text x="388" y="876" font-size="10" fill="#854F0B">que o retriever filtre por vigência. Indexar apenas</text>
  <text x="388" y="890" font-size="10" fill="#854F0B">documentos com status explícito de vigência.</text>

  <rect x="724" y="826" width="356" height="72" rx="7" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="902" y="844" text-anchor="middle" font-size="11" font-weight="600" fill="#042C53">Médio prazo — governança</text>
  <text x="740" y="862" font-size="10" fill="#185FA5">Verificar status da PROC-043 (citada como "em</text>
  <text x="740" y="876" font-size="10" fill="#185FA5">revisão"). Confirmar se descontos de clientes antigos</text>
  <text x="740" y="890" font-size="10" fill="#185FA5">foram atualizados para os percentuais da v2.</text>

  <!-- Resumo -->
  <text x="20" y="922" font-size="10" fill="#888780">3 divergências numéricas críticas · 1 alto · 2 cláusulas exclusivas na v2 · 1 cláusula exclusiva na v1 · 1 cláusula idêntica</text>
  <text x="550" y="940" text-anchor="middle" font-size="10" fill="#888780">Projeto Assistente RAG NovaTech · Discovery · DB1</text>
