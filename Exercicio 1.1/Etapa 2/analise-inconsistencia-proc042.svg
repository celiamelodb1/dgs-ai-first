  <text x="700" y="322" text-anchor="middle" font-size="11" fill="#3B6D11">≥8: −5% · ≥15: −10%</text>
  <text x="700" y="334" text-anchor="middle" font-size="10" fill="#3B6D11">&gt;10%: aprovação Diretoria</text>
