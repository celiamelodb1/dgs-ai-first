<svg width="1100" viewBox="0 0 1100 980" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Análise de inconsistência — PROC-042 v1 vs v2</title>
  <desc>Comparação linha a linha entre PROC-042 v1.0 (mar/2023) e PROC-042 v2.0 (nov/2023): divergências numéricas, cláusulas exclusivas, multiplicadores regionais e recomendações de ação.</desc>

